[package]
name = "http_server"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
uuid = { version = "1.8.0", features = ["v4"] }
mime_guess = "2.0.4"

[dev-dependencies]
reqwest = { version = "0.12.5", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4.0"
once_cell = "1.19.0"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
