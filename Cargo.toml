[package]
name = "http_server"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2.153"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.115"
uuid = { version = "1.7.0", features = ["v4"] }
log = "0.4.21"
fern = "0.6.2"
clap = { version = "4.5.4", features = ["derive"] }
chrono = "0.4.38"
mime_guess = "2.0.4"

[dev-dependencies]
reqwest = { version = "0.11.26", features = ["blocking", "json"] }
lazy_static = "1.4.0"
once_cell = "1.19.0"
hyper = { version = "0.14", features = ["full"] }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "multi_host_test"
path = "tests/multi_host_test.rs"

[[test]]
name = "error_page_test"
path = "tests/error_page_test.rs"




